# Publica una release al subir una etiqueta vX.Y.Z: compila los instaladores de Windows
# (NSIS .exe y MSI) en GitHub y los adjunta a la release con las notas de
# .github/release-notes/<etiqueta>.md
name: Publicar release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Crear la release con sus notas
        id: release
        uses: softprops/action-gh-release@v2
        with:
          name: OmniChat ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          draft: false
          prerelease: false

      - name: Compilar y adjuntar los instaladores
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ steps.release.outputs.id }}
